apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cron
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello-world-task
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            args:
            - /bin/sh
            - -c
            - echo "CronJob executed at $(date)"
          restartPolicy: OnFailure
