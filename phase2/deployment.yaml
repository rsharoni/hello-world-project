apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: rsharoni/hello-world:1.0.0
          ports:
            - containerPort: 5000

          # Readiness Probe — can this pod receive traffic?
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Liveness Probe — should Kubernetes restart this pod?
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            
          envFrom:
            - configMapRef:
                name: hello-world-config
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 200m
          volumeMounts:
            - name: data-volume
              mountPath: /data   # <-- inside the container
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: local-pvc

